name: Mushroom exhibit draft
on:
  push:
    paths:
      - 'apps/mushroom-exploration/**'
      - 'schemas/mushroom-exploration.source.schema.json'
      - 'tools/*mushroom-exploration*.mjs'
      - 'tools/test-mushroom-journal.mjs'
      - 'package*.json'
      - '.github/workflows/mushroom-exploration-ci.yml'
  pull_request:
    paths:
      - 'apps/mushroom-exploration/**'
      - 'schemas/mushroom-exploration.source.schema.json'
      - 'tools/*mushroom-exploration*.mjs'
      - 'tools/test-mushroom-journal.mjs'
      - 'package*.json'
      - '.github/workflows/mushroom-exploration-ci.yml'
permissions:
  contents: read
jobs:
  validate-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate editable source, publication guard, and standalone preview
        run: npm run check:mushrooms
      - name: Save standalone exhibit preview
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-exhibit-preview
          path: dist/mushroom-exploration/index.html
          if-no-files-found: error
          retention-days: 30
