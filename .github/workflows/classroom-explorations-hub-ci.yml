name: Classroom Explorations Hub CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/classroom-explorations-hub/**'
      - 'registry/hrv-routes.source.json'
      - 'schemas/hrv-page-envelope.schema.json'
      - 'schemas/hrv-route-registry.schema.json'
      - 'schemas/classroom-explorations-hub.source.schema.json'
      - 'schemas/classroom-explorations-hub.runtime.schema.json'
      - 'tools/*classroom-explorations-hub*.mjs'
      - 'tools/lib/json-schema-lite.mjs'
      - 'tools/lib/classroom-explorations-hub-contract.mjs'
      - 'tools/lib/classroom-explorations-hub-operations.mjs'
      - 'docs/classroom-explorations-hub.md'
      - 'docs/classroom-explorations-hub-migration-evidence.md'
      - 'docs/edublogs-integration/classroom-explorations-hub/**'
      - '.github/workflows/classroom-explorations-hub-ci.yml'
  pull_request:
    paths:
      - 'apps/classroom-explorations-hub/**'
      - 'registry/hrv-routes.source.json'
      - 'schemas/**classroom-explorations-hub**'
      - 'schemas/hrv-page-envelope.schema.json'
      - 'schemas/hrv-route-registry.schema.json'
      - 'tools/*classroom-explorations-hub*.mjs'
      - 'tools/lib/json-schema-lite.mjs'
      - 'tools/lib/classroom-explorations-hub-contract.mjs'
      - 'tools/lib/classroom-explorations-hub-operations.mjs'
      - 'docs/classroom-explorations-hub-migration-evidence.md'
      - 'docs/classroom-explorations-hub-viewport-typography-audit-2026-08-28.md'
      - 'docs/edublogs-integration/classroom-explorations-hub-test/**'
permissions:
  contents: read
jobs:
  verify-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax check browser runtime
        run: |
          node --check apps/classroom-explorations-hub/src/bootstrap.js
          node --check apps/classroom-explorations-hub/src/runtime.js
          node --check apps/classroom-explorations-hub/src/review-bootstrap.js
          node --check apps/classroom-explorations-hub/src/runtime-v3.js
      - name: Full clean-baseline contract, build, and publication checks
        run: npm run check:hub
