name: Classroom Explorations Hub CI
on:
  push:
    branches: [main, hub-authoring-v2-2026-08-28]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/classroom-explorations-hub/**'
      - 'registry/hrv-routes.source.json'
      - 'schemas/hrv-page-envelope.schema.json'
      - 'schemas/hrv-route-registry.schema.json'
      - 'schemas/classroom-explorations-hub.source.schema.json'
      - 'schemas/classroom-explorations-hub.runtime.schema.json'
      - 'schemas/classroom-explorations-hub.control.schema.json'
      - 'releases/classroom-explorations-hub/**'
      - 'tools/*classroom-explorations-hub*.mjs'
      - 'tools/lib/json-schema-lite.mjs'
      - 'tools/lib/classroom-explorations-hub-contract.mjs'
      - 'tools/lib/classroom-explorations-hub-operations.mjs'
      - 'tools/lib/classroom-explorations-hub-transactions.mjs'
      - 'docs/classroom-explorations-hub*.md'
      - 'docs/edublogs-integration/classroom-explorations-hub/**'
      - 'docs/edublogs-integration/classroom-explorations-hub-test/**'
      - '.github/workflows/classroom-explorations-hub-ci.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/classroom-explorations-hub/**'
      - 'registry/hrv-routes.source.json'
      - 'schemas/**classroom-explorations-hub**'
      - 'schemas/hrv-page-envelope.schema.json'
      - 'schemas/hrv-route-registry.schema.json'
      - 'releases/classroom-explorations-hub/**'
      - 'tools/*classroom-explorations-hub*.mjs'
      - 'tools/lib/json-schema-lite.mjs'
      - 'tools/lib/classroom-explorations-hub-contract.mjs'
      - 'tools/lib/classroom-explorations-hub-operations.mjs'
      - 'tools/lib/classroom-explorations-hub-transactions.mjs'
      - 'docs/classroom-explorations-hub*.md'
      - 'docs/edublogs-integration/classroom-explorations-hub/**'
      - 'docs/edublogs-integration/classroom-explorations-hub-test/**'
      - '.github/workflows/classroom-explorations-hub-ci.yml'
permissions:
  contents: read
jobs:
  verify-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: 155.0.8059.39
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax check browser runtime
        run: |
          node --check apps/classroom-explorations-hub/src/bootstrap.js
          node --check apps/classroom-explorations-hub/src/runtime.js
      - name: Repository test and build suite
        run: npm run check
      - name: Full Hub contract, presentation, build, and publication checks
        run: npm run check:hub
        env:
          HUB_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          HUB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/hub-browser-evidence
      - name: Upload Linux browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-explorations-hub-browser-linux-${{ github.sha }}
          path: ${{ runner.temp }}/hub-browser-evidence
          if-no-files-found: warn
          retention-days: 14

  verify-hub-native-zoom:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: 155.0.8059.39
      - name: Install locked dependencies
        run: npm ci
      - name: Build Hub preview from canonical inputs
        run: npm run build:hub
      - name: Verify Windows native zoom and responsive card states
        run: npm run test:hub:browser
        env:
          HUB_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          HUB_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}\hub-browser-evidence
      - name: Upload Windows browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-explorations-hub-browser-windows-${{ github.sha }}
          path: ${{ runner.temp }}\hub-browser-evidence
          if-no-files-found: warn
          retention-days: 14
