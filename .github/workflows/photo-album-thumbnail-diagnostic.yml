name: Photo Album thumbnail diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/photo-album-thumbnail-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-album-visual-complete-2026-08-18
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 >/tmp/preview.log 2>&1 &
          for i in {1..80}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep .25; done
          tarball="$(npm pack playwright-core@1.55.0 --silent)"
          rm -rf node_modules/playwright-core && mkdir -p node_modules/playwright-core
          tar -xzf "$tarball" -C node_modules/playwright-core --strip-components=1
          rm -f "$tarball"
          cat > .diag.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome'});
          const p=await browser.newPage({viewport:{width:1920,height:911}});
          await p.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded'});
          await p.waitForSelector('.hrv-album-card'); await p.waitForTimeout(3000);
          const href=await p.locator('.hrv-album-card').filter({hasText:'Pumpkin'}).first().getAttribute('href');
          await p.goto(new URL(href,'http://127.0.0.1:4174/').href,{waitUntil:'domcontentloaded'});
          await p.waitForSelector('.hrv-photo-card'); await p.waitForTimeout(3000);
          const data=await p.locator('.hrv-photo-card').first().evaluate(card=>{const img=card.querySelector('img');const cs=img?getComputedStyle(img):null;const bcs=getComputedStyle(card);return {cardClass:card.className,cardBg:bcs.backgroundImage,imgSrc:img?.src,naturalWidth:img?.naturalWidth,naturalHeight:img?.naturalHeight,complete:img?.complete,opacity:cs?.opacity,display:cs?.display,visibility:cs?.visibility,zIndex:cs?.zIndex,position:cs?.position,width:cs?.width,height:cs?.height};});
          console.log('THUMBNAIL_DIAGNOSTIC='+JSON.stringify(data));
          await browser.close();
          EOF
          node .diag.mjs
