name: Build Classroom Explorations Hub 2026.08.10.2

on:
  push:
    branches:
      - feature/classroom-explorations-hub-v1-mainline
    paths:
      - ".github/workflows/classroom-explorations-hub-release-2026-08-10-2.yml"
      - "apps/classroom-explorations-hub/**"
      - "schemas/classroom-explorations-hub.schema.json"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.hub.config.ts"
      - "tools/build-classroom-explorations-hub.mjs"
      - "tools/stage-classroom-explorations-hub-release.mjs"

permissions:
  contents: write

jobs:
  verify-build-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build Hub
        run: npm run check:hub

      - name: Stage immutable release
        shell: bash
        run: |
          if [ -d "releases/classroom-explorations-hub/2026.08.10.2" ]; then
            echo "Release 2026.08.10.2 already exists; verification completed."
            exit 0
          fi
          export HRV_SOURCE_COMMIT="$(git rev-parse HEAD)"
          npm run stage:hub-release -- 2026.08.10.2

      - name: Commit immutable release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/classroom-explorations-hub/2026.08.10.2
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Stage Classroom Explorations Hub release 2026.08.10.2 [skip hub release]"
          git push
