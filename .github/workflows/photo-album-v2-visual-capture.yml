name: Capture Photo Album V2 visuals

on:
  push:
    branches:
      - photo-album-home-v2-rebuild
    paths:
      - ".github/workflows/photo-album-v2-visual-capture.yml"
      - "apps/photo-album/**"
      - "tests/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: photo-album-home-v2-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Start local preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/hrv-photo-preview.log 2>&1 &
          echo $! > /tmp/hrv-photo-preview.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep .25
          done
          cat /tmp/hrv-photo-preview.log
          exit 1

      - name: Capture desktop and phone
        shell: bash
        run: |
          mkdir -p qa/photo-album/v2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --window-size=1440,1000 --screenshot=qa/photo-album/v2/desktop.png http://127.0.0.1:4174/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=7600 --window-size=1440,1000 --screenshot=qa/photo-album/v2/desktop-mid-travel.png http://127.0.0.1:4174/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --window-size=390,844 --screenshot=qa/photo-album/v2/phone.png http://127.0.0.1:4174/
          base64 -w 0 qa/photo-album/v2/desktop.png > qa/photo-album/v2/desktop.png.b64
          base64 -w 0 qa/photo-album/v2/desktop-mid-travel.png > qa/photo-album/v2/desktop-mid-travel.png.b64
          base64 -w 0 qa/photo-album/v2/phone.png > qa/photo-album/v2/phone.png.b64

      - name: Commit QA captures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/photo-album/v2/*.png qa/photo-album/v2/*.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture Photo Album V2 visual QA"
          git push origin HEAD:photo-album-home-v2-rebuild
