name: Build Photo Album 2026.08.10.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/photo-album-release-2026-08-10-5.yml"
      - "apps/photo-album/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tools/stage-photo-album-release.mjs"

permissions:
  contents: write

jobs:
  verify-build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Typecheck and build
        run: npm run build

      - name: Stage immutable release
        shell: bash
        run: |
          if [ -d "releases/photo-album/2026.08.10.5" ]; then
            echo "Release 2026.08.10.5 already exists; verification completed."
            exit 0
          fi
          npm run stage:photo-album-release

      - name: Commit immutable release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/photo-album/2026.08.10.5
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Stage Photo Album release 2026.08.10.5 [skip photo release]"
          git push
