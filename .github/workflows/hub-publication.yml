name: Hub publication contract
on:
  push:
    branches: [feature/hub-swapper-publication-2026-11-10]
  pull_request:
    paths:
      - 'apps/classroom-explorations-hub/**'
      - 'tools/*classroom-explorations-hub*'
      - 'tools/lib/*classroom-explorations-hub*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:hub
        env:
          HUB_CHROME_PATH: /usr/bin/google-chrome
