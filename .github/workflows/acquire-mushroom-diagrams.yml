name: Acquire published mushroom diagrams
on:
  push:
    branches: [feature/mushroom-exhibit-scaffold]
    paths:
      - '.github/workflows/acquire-mushroom-diagrams.yml'
      - 'tools/acquire-mushroom-diagrams.py'
      - 'apps/mushroom-exploration/source/published-diagrams.json'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mushroom-exhibit-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0 CairoSVG==2.8.2
      - run: python tools/acquire-mushroom-diagrams.py
      - uses: actions/upload-artifact@v4
        with:
          name: published-mushroom-diagrams
          path: |
            apps/mushroom-exploration/src/assets/diagram-*.webp
            apps/mushroom-exploration/source/published-diagrams.delivery.json
            apps/mushroom-exploration/source-assets/published-diagrams
      - name: Preserve the sourced images and conversion receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mushroom-exploration/src/assets/diagram-*.webp apps/mushroom-exploration/source/published-diagrams.delivery.json apps/mushroom-exploration/source-assets/published-diagrams
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve credited published diagrams and lossless delivery copies'
          git push origin HEAD:feature/mushroom-exhibit-scaffold
