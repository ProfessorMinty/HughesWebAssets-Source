name: Photo Album source boundary cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/photo-album-clean-source-finalize.yml"

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current visual candidate
        uses: actions/checkout@v4
        with:
          ref: photo-album-visual-complete-2026-08-18
          fetch-depth: 0

      - name: Check out QA control tools separately
        uses: actions/checkout@v4
        with:
          ref: qa/photo-album-visual-complete-2026-08-18
          path: qa-control

      - name: Apply deterministic four-moment magic completion patch
        run: python qa-control/tools/photo-album-magic-completion-patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Prove Photo Album still does not own Reduced Effects
        shell: bash
        run: |
          if grep -R --line-number -E 'prefers-reduced-motion|prefersReducedMotion|showReducedChange|REDUCED_FADE_HALF_MS' apps/photo-album/src; then
            echo 'Four-moment magic patch restored app-local motion reduction.' >&2
            exit 1
          fi

      - name: Commit verified magic completion to visual branch
        shell: bash
        run: |
          rm -rf qa-control
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/photo-album/src
          git commit -m "Complete Photo Album four-moment theme worlds"
          git push origin HEAD:photo-album-visual-complete-2026-08-18
