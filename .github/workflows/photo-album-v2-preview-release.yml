name: Stage Photo Album V2 preview 2026.08.10.6

on:
  push:
    branches:
      - photo-album-home-v2-rebuild
    paths:
      - ".github/workflows/photo-album-v2-preview-release.yml"
      - "apps/photo-album/**"
      - "tests/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tools/stage-photo-album-release.mjs"

permissions:
  contents: write

jobs:
  verify-build-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: photo-album-home-v2-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tests
        run: npm run test

      - name: Typecheck and build
        run: npm run build

      - name: Stage preview release
        run: node tools/stage-photo-album-release.mjs 2026.08.10.6

      - name: Commit preview artifacts to rebuild branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/photo-album/2026.08.10.6
          git commit -m "Stage Photo Album V2 preview 2026.08.10.6"
          git push origin HEAD:photo-album-home-v2-rebuild
