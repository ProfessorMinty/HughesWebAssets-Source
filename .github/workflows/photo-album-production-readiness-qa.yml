name: Photo Album production readiness QA

on:
  push:
    branches:
      - qa/photo-album-production-readiness-2026-08-19

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Production boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Photos are coming soon' apps/photo-album/src/components/year-home-v2.ts
          grep -q 'RENDER_BATCH_SIZE = 60' apps/photo-album/src/components/photo-grid.ts
          grep -q 'production-readiness.css' apps/photo-album/src/entry.ts
          ! grep -R --line-number -E 'prefers-reduced-motion|prefersReducedMotion|showReducedChange|REDUCED_FADE_HALF_MS' apps/photo-album/src
